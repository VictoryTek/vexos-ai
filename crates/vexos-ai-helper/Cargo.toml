[package]
name = "vexos-ai-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "VexOS assistant helper: a session D-Bus service that only the GNOME Shell may call"

[dependencies]
gio = "0.22"
glib = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }
vexos-ai-core = { path = "../vexos-ai-core" }
vexos-ai-viewmodel = { path = "../vexos-ai-viewmodel" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[features]
# Builds the test-only caller program (testing/fakecaller.rs). Off in a release.
testing = []

[[bin]]
name = "vexos-ai-helper"
path = "src/main.rs"

[[bin]]
name = "vexos-ai-helper-fakecaller"
path = "testing/fakecaller.rs"
required-features = ["testing"]
