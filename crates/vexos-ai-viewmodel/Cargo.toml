[package]
name = "vexos-ai-viewmodel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "VexOS assistant panel: what the window shows, without GTK"

[dependencies]
# No default features: no HTML renderer.
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
vexos-ai-core = { path = "../vexos-ai-core" }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
