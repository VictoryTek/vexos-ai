[package]
name = "vexos-ai-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "VexOS assistant panel: a GTK4/libadwaita window over the assistant core"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
vexos-ai-core = { path = "../vexos-ai-core" }
vexos-ai-viewmodel = { path = "../vexos-ai-viewmodel" }
